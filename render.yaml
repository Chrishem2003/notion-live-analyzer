services:
  # User-facing Streamlit application.
  - type: web
    name: notion-live-analyzer
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Keep existing deployment secrets in Render's dashboard; never sync blanks from Git.
      - key: NOTION_TOKEN
        sync: false
      - key: DATABASE_ID
        sync: false
      - key: PLATFORM_API_KEY
        sync: false
      - key: RESEARCH_RUN_API_URL
        value: https://notion-live-analyzer-api.onrender.com
      - key: AUTO_FIX_DEPS
        value: "false"
      - key: STREAMLIT_SERVER_RUN_ON_SAVE
        value: "false"
      - key: STREAMLIT_RUNNER_FAST_RERUNS
        value: "true"

  # API for authenticated Bio-Research run write-back.
  # The ledger path below assumes a persistent disk mounted at /var/data.
  # Do not enable this API for real research until the disk/database and
  # backup/restore are verified. Render Free does not provide this persistence.
  - type: web
    name: notion-live-analyzer-api
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile.api
    dockerCommand: sh scripts/start_research_run_api.sh
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PLATFORM_API_KEY
        sync: false
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_ANALYSIS_RUNS_DATA_SOURCE_ID
        sync: false
      - key: NOTION_PROJECTS_DATA_SOURCE_ID
        sync: false
      - key: NOTION_PROTOCOLS_DATA_SOURCE_ID
        sync: false
      - key: NOTION_SAMPLES_DATA_SOURCE_ID
        sync: false
      - key: NOTION_EXPERIMENTAL_DATA_DATA_SOURCE_ID
        sync: false
      - key: NOTION_LITERATURE_DATA_SOURCE_ID
        sync: false
      - key: NOTION_GENOMIC_SEQUENCE_DATA_SOURCE_ID
        sync: false
      - key: NOTION_TASKS_DATA_SOURCE_ID
        sync: false
      - key: NOTION_BRAIN_NOTES_DATA_SOURCE_ID
        sync: false
      # Fail closed unless persistent storage is actually mounted and writable.
      - key: RESEARCH_RUN_IDEMPOTENCY_DB
        value: /var/data/research_run_idempotency.sqlite3
      - key: RESEARCH_RUN_ALLOW_EPHEMERAL_LEDGER
        value: "false"
      # Free-plan safe mode: disable Notion run writes without durable idempotency storage.
      - key: RESEARCH_RUN_WRITEBACK_ENABLED
        value: "false"
