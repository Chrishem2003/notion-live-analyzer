name: Research Run ID Normalization

on:
  pull_request:
    branches: [main]
    paths:
      - "api_server.py"
      - "modules/research_run_idempotency.py"
      - "tests/test_research_run_api.py"
      - "tests/test_research_run_idempotency.py"
      - ".github/workflows/research-run-id-normalization.yml"
      - "requirements-api.txt"
  push:
    branches: [main]
    paths:
      - "api_server.py"
      - "modules/research_run_idempotency.py"
      - "tests/test_research_run_api.py"
      - "tests/test_research_run_idempotency.py"
      - ".github/workflows/research-run-id-normalization.yml"
      - "requirements-api.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-run-id-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install API and focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-api.txt pytest httpx numpy pandas

      - name: Test research-run request and ledger contracts
        run: |
          python -m pytest -q \
            tests/test_research_run_api.py \
            tests/test_research_run_idempotency.py

      - name: Compile modified API and ledger modules
        run: |
          python -m compileall -q \
            api_server.py \
            modules/research_run_idempotency.py
