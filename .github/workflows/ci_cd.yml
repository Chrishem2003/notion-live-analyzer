name: CHRISHEM CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set Up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run Automated Test Suite
      run: |
        pytest -v

    - name: Build lightweight API container
      run: docker build --file Dockerfile.api --tag notion-live-analyzer-api:test .

    - name: Verify API runtime imports
      run: docker run --rm --entrypoint python notion-live-analyzer-api:test -c "import api_server; print('api_import_ok')"
