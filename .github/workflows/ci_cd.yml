name: CHRISHEM CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set Up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run Automated Test Suite
      run: |
        pytest -v

    - name: Start isolated PostgreSQL for ledger migration validation
      run: |
        docker run -d --name ledger-postgres \
          -e POSTGRES_PASSWORD=postgres \
          -e POSTGRES_DB=ledger_test \
          -p 5432:5432 postgres:16
        for attempt in $(seq 1 30); do
          if docker exec ledger-postgres pg_isready -U postgres -d ledger_test; then break; fi
          sleep 2
        done
        docker exec ledger-postgres pg_isready -U postgres -d ledger_test
        docker exec ledger-postgres psql -v ON_ERROR_STOP=1 -U postgres -d ledger_test -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;"

    - name: Apply ledger migration to isolated PostgreSQL
      env:
        PGPASSWORD: postgres
      run: |
        psql -h localhost -U postgres -d ledger_test -v ON_ERROR_STOP=1 \
          -f supabase/migrations/20261022210000_platform_job_ledger.sql

    - name: Verify ledger SQL security and lifecycle contracts
      env:
        PGPASSWORD: postgres
      run: |
        psql -h localhost -U postgres -d ledger_test -v ON_ERROR_STOP=1 <<'SQL'
        DO $$
        DECLARE
          first_job jsonb;
          duplicate_job jsonb;
          claim jsonb;
          finished jsonb;
          status_doc jsonb;
          job_uuid uuid;
          lease_uuid uuid;
          hash_value text := repeat('a', 64);
        BEGIN
          IF NOT (SELECT relrowsecurity FROM pg_class WHERE oid = 'public.platform_jobs'::regclass) THEN
            RAISE EXCEPTION 'RLS missing on platform_jobs';
          END IF;
          IF NOT (SELECT relrowsecurity FROM pg_class WHERE oid = 'public.platform_job_attempts'::regclass) THEN
            RAISE EXCEPTION 'RLS missing on platform_job_attempts';
          END IF;
          IF NOT (SELECT relrowsecurity FROM pg_class WHERE oid = 'public.platform_audit_events'::regclass) THEN
            RAISE EXCEPTION 'RLS missing on platform_audit_events';
          END IF;
          IF has_function_privilege('anon', 'public.platform_claim_job(text,integer)', 'EXECUTE') THEN
            RAISE EXCEPTION 'anon can execute privileged claim RPC';
          END IF;
          IF NOT has_function_privilege('service_role', 'public.platform_claim_job(text,integer)', 'EXECUTE') THEN
            RAISE EXCEPTION 'service_role cannot execute claim RPC';
          END IF;
          IF has_table_privilege('service_role', 'public.platform_jobs', 'SELECT') THEN
            RAISE EXCEPTION 'service_role has direct table access';
          END IF;

          first_job := public.platform_enqueue_job(
            'platform.synthetic.validate', 'ci:test', 'idem-ci-1', hash_value,
            '{"synthetic":true}'::jsonb, 2
          );
          duplicate_job := public.platform_enqueue_job(
            'platform.synthetic.validate', 'ci:test', 'idem-ci-1', hash_value,
            '{"synthetic":true}'::jsonb, 2
          );
          IF (first_job->>'job_id') <> (duplicate_job->>'job_id')
             OR (duplicate_job->>'created')::boolean THEN
            RAISE EXCEPTION 'idempotent enqueue contract failed';
          END IF;

          BEGIN
            PERFORM public.platform_enqueue_job(
              'platform.synthetic.validate', 'ci:test', 'idem-ci-1', repeat('b', 64),
              '{"synthetic":true}'::jsonb, 2
            );
            RAISE EXCEPTION 'idempotency hash conflict was accepted';
          EXCEPTION WHEN SQLSTATE '22023' THEN
            NULL;
          END;

          claim := public.platform_claim_job('ci-worker', 30);
          IF claim IS NULL THEN RAISE EXCEPTION 'queued job was not claimed'; END IF;
          job_uuid := (claim->>'job_id')::uuid;
          lease_uuid := (claim->>'lease_token')::uuid;
          finished := public.platform_finish_job(
            job_uuid, 'ci-worker', lease_uuid, 'succeeded',
            '{"validated":true}'::jsonb, NULL
          );
          IF finished->>'status' <> 'succeeded' THEN
            RAISE EXCEPTION 'job did not reach succeeded';
          END IF;
          status_doc := public.platform_get_job(job_uuid, 'ci:test');
          IF status_doc->>'status' <> 'succeeded'
             OR status_doc ? 'payload' OR status_doc ? 'lease_token' THEN
            RAISE EXCEPTION 'status response unsafe or incorrect';
          END IF;

          BEGIN
            UPDATE public.platform_audit_events SET event_type = 'tampered'
            WHERE job_id = job_uuid;
            RAISE EXCEPTION 'audit mutation was accepted';
          EXCEPTION WHEN raise_exception THEN
            IF SQLERRM = 'audit mutation was accepted' THEN RAISE; END IF;
          END;

          BEGIN
            PERFORM public.platform_finish_job(
              job_uuid, 'ci-worker', lease_uuid, 'succeeded',
              '{"validated":true}'::jsonb, NULL
            );
            RAISE EXCEPTION 'stale lease was accepted';
          EXCEPTION WHEN SQLSTATE '42501' THEN
            NULL;
          END;
        END;
        $$;
        SQL
        docker rm -f ledger-postgres
     
    - name: Build lightweight API container
      run: docker build --file Dockerfile.api --tag notion-live-analyzer-api:test .

    - name: Verify API runtime imports
      run: docker run --rm --entrypoint python notion-live-analyzer-api:test -c "import api_server; print('api_import_ok')"
