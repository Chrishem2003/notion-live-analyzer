name: CHRISHEM CI/CD Pipeline

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set Up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run Automated Test Suite
      run: |
        pytest -v

    - name: Validate ledger service startup scripts
      run: |
        sh -n scripts/start_platform_ledger_worker.sh
        sh -n scripts/start_platform_ledger_beat.sh

    - name: Start isolated PostgreSQL for ledger migration validation
      run: |
        docker run -d --name ledger-postgres \
          -e POSTGRES_PASSWORD=postgres \
          -e POSTGRES_DB=ledger_test \
          -p 5432:5432 postgres:16
        for attempt in $(seq 1 30); do
          if docker exec ledger-postgres pg_isready -U postgres -d ledger_test; then break; fi
          sleep 2
        done
        docker exec ledger-postgres pg_isready -U postgres -d ledger_test
        docker exec ledger-postgres psql -v ON_ERROR_STOP=1 -U postgres -d ledger_test -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;"

    - name: Apply ledger migration to isolated PostgreSQL
      env:
        PGPASSWORD: postgres
      run: |
        psql -h localhost -U postgres -d ledger_test -v ON_ERROR_STOP=1 \
          -f supabase/migrations/20261022210000_platform_job_ledger.sql \
          -f supabase/migrations/20261023010000_platform_job_dispatch_reconciliation.sql \
          -f supabase/migrations/20261023020000_platform_job_ledger_metrics.sql

    - name: Verify ledger SQL security and lifecycle contracts
      env:
        PGPASSWORD: postgres
      run: |
        psql -h localhost -U postgres -d ledger_test -v ON_ERROR_STOP=1 <<'SQL'
        DO $$
        DECLARE
          first_job jsonb;
          duplicate_job jsonb;
          claim jsonb;
          finished jsonb;
          status_doc jsonb;
          reserved_jobs jsonb;
          second_reservation jsonb;
          metrics jsonb;
          job_uuid uuid;
          lease_uuid uuid;
          crash_job_uuid uuid;
          crash_lease_uuid uuid;
          hash_value text := repeat('a', 64);
        BEGIN
          IF NOT (SELECT relrowsecurity FROM pg_class WHERE oid = 'public.platform_jobs'::regclass) THEN
            RAISE EXCEPTION 'RLS missing on platform_jobs';
          END IF;
          IF NOT (SELECT relrowsecurity FROM pg_class WHERE oid = 'public.platform_job_attempts'::regclass) THEN
            RAISE EXCEPTION 'RLS missing on platform_job_attempts';
          END IF;
          IF NOT (SELECT relrowsecurity FROM pg_class WHERE oid = 'public.platform_audit_events'::regclass) THEN
            RAISE EXCEPTION 'RLS missing on platform_audit_events';
          END IF;
          IF has_function_privilege('anon', 'public.platform_claim_job(text,integer)', 'EXECUTE') THEN
            RAISE EXCEPTION 'anon can execute privileged claim RPC';
          END IF;
          IF NOT has_function_privilege('service_role', 'public.platform_claim_job(text,integer)', 'EXECUTE') THEN
            RAISE EXCEPTION 'service_role cannot execute claim RPC';
          END IF;
          IF has_table_privilege('service_role', 'public.platform_jobs', 'SELECT') THEN
            RAISE EXCEPTION 'service_role has direct table access';
          END IF;
          IF has_function_privilege('anon', 'public.platform_reserve_dispatches(integer)', 'EXECUTE') THEN
            RAISE EXCEPTION 'anon can execute dispatch reservation RPC';
          END IF;
          IF NOT has_function_privilege('service_role', 'public.platform_reserve_dispatches(integer)', 'EXECUTE') THEN
            RAISE EXCEPTION 'service_role cannot execute dispatch reservation RPC';
          END IF;
          IF has_function_privilege('anon', 'public.platform_get_job_metrics()', 'EXECUTE') THEN
            RAISE EXCEPTION 'anon can execute privileged metrics RPC';
          END IF;
          IF NOT has_function_privilege('service_role', 'public.platform_get_job_metrics()', 'EXECUTE') THEN
            RAISE EXCEPTION 'service_role cannot execute metrics RPC';
          END IF;

          first_job := public.platform_enqueue_job(
            'platform.synthetic.validate', 'ci:test', 'idem-ci-1', hash_value,
            '{"synthetic":true}'::jsonb, 2
          );
          duplicate_job := public.platform_enqueue_job(
            'platform.synthetic.validate', 'ci:test', 'idem-ci-1', hash_value,
            '{"synthetic":true}'::jsonb, 2
          );
          IF (first_job->>'job_id') <> (duplicate_job->>'job_id')
             OR (duplicate_job->>'created')::boolean THEN
            RAISE EXCEPTION 'idempotent enqueue contract failed';
          END IF;

          BEGIN
            PERFORM public.platform_enqueue_job(
              'platform.synthetic.validate', 'ci:test', 'idem-ci-1', repeat('b', 64),
              '{"synthetic":true}'::jsonb, 2
            );
            RAISE EXCEPTION 'idempotency hash conflict was accepted';
          EXCEPTION WHEN SQLSTATE '23505' THEN
            NULL;
          END;

          reserved_jobs := public.platform_reserve_dispatches(10);
          IF jsonb_array_length(reserved_jobs) <> 1
             OR reserved_jobs->0->>'job_id' <> first_job->>'job_id' THEN
            RAISE EXCEPTION 'dispatch reconciliation did not reserve the queued job';
          END IF;
          second_reservation := public.platform_reserve_dispatches(10);
          IF jsonb_array_length(second_reservation) <> 0 THEN
            RAISE EXCEPTION 'dispatch reservation cooldown did not prevent duplicate dispatch';
          END IF;

          claim := public.platform_claim_job('ci-worker', 30);
          IF claim IS NULL THEN RAISE EXCEPTION 'queued job was not claimed'; END IF;
          job_uuid := (claim->>'job_id')::uuid;
          lease_uuid := (claim->>'lease_token')::uuid;
          finished := public.platform_finish_job(
            job_uuid, 'ci-worker', lease_uuid, 'succeeded',
            '{"validated":true}'::jsonb, NULL
          );
          IF finished->>'status' <> 'succeeded' THEN
            RAISE EXCEPTION 'job did not reach succeeded';
          END IF;
          status_doc := public.platform_get_job(job_uuid, 'ci:test');
          IF status_doc->>'status' <> 'succeeded'
             OR status_doc ? 'payload' OR status_doc ? 'lease_token' THEN
            RAISE EXCEPTION 'status response unsafe or incorrect';
          END IF;

          -- Handler failures should requeue until the configured attempt budget is exhausted.
          PERFORM public.platform_enqueue_job(
            'platform.synthetic.validate', 'ci:test', 'idem-ci-retry', repeat('c', 64),
            '{"synthetic":true}'::jsonb, 2
          );
          claim := public.platform_claim_job('ci-worker', 30);
          IF claim IS NULL THEN RAISE EXCEPTION 'retry test job was not claimed'; END IF;
          job_uuid := (claim->>'job_id')::uuid;
          lease_uuid := (claim->>'lease_token')::uuid;
          finished := public.platform_finish_job(
            job_uuid, 'ci-worker', lease_uuid, 'failed', NULL, '{"code":"handler_failed"}'::jsonb
          );
          IF finished->>'status' <> 'queued' THEN
            RAISE EXCEPTION 'first handler failure was not queued for retry';
          END IF;
          reserved_jobs := public.platform_reserve_dispatches(10);
          IF jsonb_array_length(reserved_jobs) <> 1
             OR reserved_jobs->0->>'job_id' <> job_uuid::text THEN
            RAISE EXCEPTION 'requeued job was not recovered by dispatch reconciliation';
          END IF;
          claim := public.platform_claim_job('ci-worker-2', 30);
          IF claim IS NULL OR (claim->>'attempt_count')::integer <> 2 THEN
            RAISE EXCEPTION 'second handler attempt was not claimed';
          END IF;
          lease_uuid := (claim->>'lease_token')::uuid;
          finished := public.platform_finish_job(
            job_uuid, 'ci-worker-2', lease_uuid, 'failed', NULL, '{"code":"handler_failed"}'::jsonb
          );
          IF finished->>'status' <> 'failed' THEN
            RAISE EXCEPTION 'retry budget exhaustion did not become failed';
          END IF;

          -- A worker crash leaves a running lease. The periodic reconciler must
          -- reserve it after expiry, and claim must advance the attempt number.
          PERFORM public.platform_enqueue_job(
            'platform.synthetic.validate', 'ci:test', 'idem-ci-crash', repeat('d', 64),
            '{"synthetic":true}'::jsonb, 3
          );
          claim := public.platform_claim_job('ci-crash-worker', 30);
          IF claim IS NULL THEN RAISE EXCEPTION 'crash recovery test job was not claimed'; END IF;
          crash_job_uuid := (claim->>'job_id')::uuid;
          crash_lease_uuid := (claim->>'lease_token')::uuid;
          UPDATE public.platform_jobs
          SET lease_until = now() - interval '1 second'
          WHERE job_id = crash_job_uuid;
          reserved_jobs := public.platform_reserve_dispatches(10);
          IF jsonb_array_length(reserved_jobs) <> 1
             OR reserved_jobs->0->>'job_id' <> crash_job_uuid::text THEN
            RAISE EXCEPTION 'expired worker lease was not reserved for recovery';
          END IF;
          claim := public.platform_claim_job('ci-recovery-worker', 30);
          IF claim IS NULL
             OR (claim->>'job_id')::uuid <> crash_job_uuid
             OR (claim->>'attempt_count')::integer <> 2 THEN
            RAISE EXCEPTION 'expired worker lease was not recovered as attempt two';
          END IF;

          metrics := public.platform_get_job_metrics();
          IF (metrics->>'total')::integer <> 3
             OR (metrics->>'succeeded')::integer <> 1
             OR (metrics->>'failed')::integer <> 1
             OR (metrics->>'running')::integer <> 1
             OR (metrics->>'expired_leases')::integer <> 0
             OR metrics ? 'payload' OR metrics ? 'actor_scope' OR metrics ? 'job_id' THEN
            RAISE EXCEPTION 'aggregate metrics are inconsistent or expose sensitive data';
          END IF;

          BEGIN
            UPDATE public.platform_audit_events SET event_type = 'tampered'
            WHERE job_id = job_uuid;
            RAISE EXCEPTION 'audit mutation was accepted';
          EXCEPTION WHEN raise_exception THEN
            IF SQLERRM = 'audit mutation was accepted' THEN RAISE; END IF;
          END;

          BEGIN
            PERFORM public.platform_finish_job(
              job_uuid, 'ci-worker', lease_uuid, 'succeeded',
              '{"validated":true}'::jsonb, NULL
            );
            RAISE EXCEPTION 'stale lease was accepted';
          EXCEPTION WHEN SQLSTATE '42501' THEN
            NULL;
          END;
        END;
        $$;
        SQL
        docker rm -f ledger-postgres
     
    - name: Build lightweight API container
      run: docker build --file Dockerfile.api --tag notion-live-analyzer-api:test .

    - name: Verify API runtime imports
      run: docker run --rm --entrypoint python notion-live-analyzer-api:test -c "import api_server; print('api_import_ok')"
