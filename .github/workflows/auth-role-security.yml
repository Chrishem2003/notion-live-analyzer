name: Authentication role security tests

on:
  push:
    branches:
      - fix/auth-role-escalation
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: auth-role-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-role-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-api.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-api.txt pytest numpy pandas
      - name: Test role assignment and bootstrap protections
        run: |
          python -m pytest -q \
            tests/test_auth_store_role_security.py \
            tests/test_bootstrap_admin.py
