name: Research Run Preflight Safety

on:
  push:
    branches:
      - feat/research-run-preflight-path-hardening-20261122
    paths:
      - "scripts/research_run_preflight.py"
      - "modules/research_run_idempotency.py"
      - "tests/test_research_run_preflight.py"
      - "tests/test_research_run_idempotency.py"
      - ".github/workflows/research-run-preflight-safety.yml"
  pull_request:
    branches:
      - feat/shared-ai-gateway-rebase-oct25
    paths:
      - "scripts/research_run_preflight.py"
      - "modules/research_run_idempotency.py"
      - "tests/test_research_run_preflight.py"
      - "tests/test_research_run_idempotency.py"
      - ".github/workflows/research-run-preflight-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests

      - name: Run preflight and idempotency regression tests
        run: |
          python -m pytest -q --confcutdir=tests \
            tests/test_research_run_preflight.py \
            tests/test_research_run_idempotency.py

      - name: Compile preflight and idempotency modules
        run: |
          python -m compileall -q \
            scripts/research_run_preflight.py \
            modules/research_run_idempotency.py
