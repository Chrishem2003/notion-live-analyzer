name: Research Run Preflight Safety

on:
  push:
    branches:
      - feat/research-run-preflight-path-hardening-20261122
      - feat/pydantic-v2-api-contracts-20261128
    paths:
      - "scripts/research_run_preflight.py"
      - "api_server.py"
      - "modules/service_api_auth.py"
      - "tests/test_service_api_auth.py"
      - "tests/test_research_run_api.py"
      - "tests/test_credentialed_http_redirects.py"
      - "modules/research_run_adapter.py"
      - "modules/research_run_client.py"
      - "platform_jobs/repository.py"
      - "platform_jobs/user_api.py"
      - "nema_agora/supabase_repository.py"
      - "shared_ai_gateway.py"
      - "tests/test_credentialed_http_redirects.py"
      - "modules/research_run_adapter.py"
      - "modules/research_run_client.py"
      - "platform_jobs/repository.py"
      - "platform_jobs/user_api.py"
      - "nema_agora/supabase_repository.py"
      - "shared_ai_gateway.py"
      - "requirements-api.txt"
      - "modules/research_run_idempotency.py"
      - "tests/test_research_run_preflight.py"
      - "tests/test_research_run_idempotency.py"
      - "scripts/research_run_staging_smoke.py"
      - "tests/test_research_run_staging_smoke.py"
      - "modules/http_header_contracts.py"
      - "platform_jobs/api.py"
      - "platform_jobs/user_api.py"
      - "shared_ai_gateway.py"
      - "sovereign_intelligence/api/service_router.py"
      - "nema_agora/api.py"
      - "tests/test_api_header_ambiguity.py"
      - "tests/test_pydantic_v2_contracts.py"
      - "tests/test_shared_ai_gateway.py"
      - "docs/research-run-writeback.md"
      - "render.yaml"
      - "Dockerfile"
      - "Dockerfile.api"
      - "scripts/start_research_run_api.sh"
      - "tests/test_deployment_entrypoint_guard.py"
      - "ollama_gateway.py"
      - "tests/test_ollama_gateway_auth.py"
      - "ollama_gateway.py"
      - "tests/test_ollama_gateway_auth.py"
      - ".github/workflows/research-run-preflight-safety.yml"
  pull_request:
    branches:
      - feat/shared-ai-gateway-rebase-oct25
      - feat/research-run-preflight-path-hardening-20261122
    paths:
      - "scripts/research_run_preflight.py"
      - "api_server.py"
      - "modules/service_api_auth.py"
      - "tests/test_service_api_auth.py"
      - "tests/test_research_run_api.py"
      - "requirements-api.txt"
      - "modules/research_run_idempotency.py"
      - "tests/test_research_run_preflight.py"
      - "tests/test_research_run_idempotency.py"
      - "scripts/research_run_staging_smoke.py"
      - "tests/test_research_run_staging_smoke.py"
      - "modules/http_header_contracts.py"
      - "platform_jobs/api.py"
      - "platform_jobs/user_api.py"
      - "shared_ai_gateway.py"
      - "sovereign_intelligence/api/service_router.py"
      - "nema_agora/api.py"
      - "tests/test_api_header_ambiguity.py"
      - "tests/test_pydantic_v2_contracts.py"
      - "tests/test_shared_ai_gateway.py"
      - "docs/research-run-writeback.md"
      - "render.yaml"
      - "Dockerfile"
      - "Dockerfile.api"
      - "scripts/start_research_run_api.sh"
      - "tests/test_deployment_entrypoint_guard.py"
      - ".github/workflows/research-run-preflight-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests

      - name: Run preflight, idempotency and staging smoke regression tests
        run: |
          python -m pytest -q --confcutdir=tests \
            tests/test_research_run_preflight.py \
            tests/test_research_run_idempotency.py \
            tests/test_research_run_staging_smoke.py \
            tests/test_service_api_auth.py \
            tests/test_deployment_entrypoint_guard.py

      - name: Compile preflight, idempotency and staging smoke modules
        run: |
          python -m compileall -q \
            scripts/research_run_preflight.py \
            modules/research_run_idempotency.py \
            scripts/research_run_staging_smoke.py \
            api_server.py \
            modules/service_api_auth.py \
            tests/test_deployment_entrypoint_guard.py

  api-auth-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-api.txt pytest

      - name: Run research-run API authentication and safety contract tests
        run: |
          python -m pytest -q -W error::pydantic.warnings.PydanticDeprecatedSince20 --confcutdir=tests tests/test_research_run_api.py tests/test_credentialed_http_redirects.py tests/test_api_header_ambiguity.py tests/test_ollama_gateway_auth.py tests/test_shared_ai_gateway.py tests/test_pydantic_v2_contracts.py

      - name: Compile API and authentication contracts
        run: |
          python -m compileall -q api_server.py modules/service_api_auth.py modules/http_header_contracts.py tests/test_research_run_api.py tests/test_api_header_ambiguity.py scripts/research_run_preflight.py modules/research_run_adapter.py modules/research_run_client.py platform_jobs/repository.py platform_jobs/api.py platform_jobs/user_api.py sovereign_intelligence/api/service_router.py nema_agora/api.py nema_agora/supabase_repository.py shared_ai_gateway.py tests/test_credentialed_http_redirects.py ollama_gateway.py tests/test_ollama_gateway_auth.py \
            tests/test_shared_ai_gateway.py \
            tests/test_pydantic_v2_contracts.py
