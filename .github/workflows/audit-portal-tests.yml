name: Research Security Regression Tests

on:
  pull_request:
    paths:
      - "modules/audit_portal.py"
      - "modules/data_transformer.py"
      - "modules/file_uploader.py"
      - "modules/project_collaboration/project_auth.py"
      - "tests/test_audit_portal.py"
      - "tests/test_expression_security.py"
      - "tests/test_file_upload_security.py tests/test_project_auth_security.py"
      - "tests/test_project_auth_security.py"
      - ".streamlit/config.toml"
      - ".github/workflows/audit-portal-tests.yml"
  push:
    branches:
      - main
      - "devin/1785103320-security-hardening"
    paths:
      - "modules/audit_portal.py"
      - "modules/data_transformer.py"
      - "tests/test_audit_portal.py"
      - "tests/test_expression_security.py"
      - ".streamlit/config.toml"
      - ".github/workflows/audit-portal-tests.yml"

permissions:
  contents: read

concurrency:
  group: research-security-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest cryptography
      - name: Compile security-sensitive modules
        run: python -m py_compile modules/audit_portal.py modules/data_transformer.py modules/file_uploader.py modules/project_collaboration/project_auth.py
      - name: Verify Streamlit security configuration
        shell: bash
        run: |
          grep -Eq '^enableXsrfProtection = true$' .streamlit/config.toml
          if grep -Eq '^enableCORS = false$' .streamlit/config.toml; then
            echo "Unsafe explicit CORS disable conflicts with the XSRF-protected deployment policy." >&2
            exit 1
          fi
      - name: Run focused security regression tests
        run: python -m pytest -q tests/test_audit_portal.py tests/test_expression_security.py tests/test_file_upload_security.py
