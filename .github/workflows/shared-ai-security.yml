name: Shared AI gateway security tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/shared-ai-gateway
      - feat/shared-ai-gateway-clean

permissions:
  contents: read

concurrency:
  group: shared-ai-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHAT_TOKEN_SECRET: ci-only-not-a-production-secret
      SHARED_AI_GATEWAY_ENABLED: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-api.txt
      - name: Install API dependencies and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-api.txt pytest numpy pandas
      - name: Run shared gateway and provider security tests
        run: |
          python -m pytest -q \
            tests/test_shared_ai_gateway.py \
            tests/test_chat_token_ttl.py \
            tests/test_sovereign_ollama_config.py \
            tests/test_sovereign_ollama_provider.py \
            tests/test_ollama_gateway_auth.py
