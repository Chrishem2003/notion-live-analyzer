name: Research QC Gate Tests

on:
  push:
    branches:
      - bio-research/qc-provenance-gates
    paths:
      - "modules/research_qc_gate.py"
      - "modules/notion_workflow_handoff.py"
      - "modules/workflow_handlers.py"
      - "modules/workflow_runtime.py"
      - "modules/workflow_key_rotation.py"
      - "modules/workflow_contract.py"
      - "modules/workflow_store.py"
      - "modules/workflow_storage.py"
      - "modules/fasta_validation.py"
      - "tests/test_research_qc_gate.py"
      - "tests/test_workflow_contract.py"
      - "tests/test_workflow_handlers.py"
      - "tests/test_workflow_runtime.py"
      - "tests/test_workflow_store.py"
      - "tests/test_workflow_storage.py"
      - "tests/test_notion_workflow_handoff.py"
      - "pages/19_Workflow_Execution_Center.py"
      - ".github/workflows/research-qc-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-qc-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research-qc-gate:
    name: Focused QC/provenance regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile workflow execution UI
        run: python -m py_compile pages/19_Workflow_Execution_Center.py
      - name: Run QC gate unit tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p "test_research_qc_gate.py" -v
      - name: Run workflow-contract regression tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p "test_workflow_contract.py" -v
      - name: Install runtime test dependency
        run: python -m pip install cryptography requests
      - name: Run workflow-handler regression tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p "test_workflow_handlers.py" -v
      - name: Run runtime and event-ledger regression tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p "test_workflow_runtime.py" -v
      - name: Run SQLite event-store regression tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p "test_workflow_store.py" -v
      - name: Run workflow storage encryption regression tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p "test_workflow_storage.py" -v
      - name: Run Notion handoff reconciliation tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p "test_notion_workflow_handoff.py" -v
