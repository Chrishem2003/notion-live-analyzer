name: NEMA-AGORA Pilot Checks
# Focused validation for the governed NEMA-AGORA pilot branch.
# CI gate: source-contract fixes must pass before roadmap advancement.
# Stabilization pass 2: immutable history, review fixtures, and execution boundaries.

on:
  push:
    branches: [feature/nema-agora-pilot]
    paths:
      - "nema_agora/**"
      - "pages/*NEMA_AGORA*.py"
      - "tests/nema_agora/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".streamlit/config.toml"
      - ".github/workflows/nema-agora-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "nema_agora/**"
      - "pages/*NEMA_AGORA*.py"
      - "tests/nema_agora/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".streamlit/config.toml"
      - ".github/workflows/nema-agora-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run NEMA-AGORA unit tests when pilot sources are present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d tests/nema_agora ]]; then
            python -m pytest --confcutdir=tests/nema_agora -q tests/nema_agora
          else
            echo "NEMA-AGORA source/tests are not present on this branch; full pilot validation runs on the implementation branch."
          fi
      - name: Compile NEMA-AGORA modules and pages
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d nema_agora ]]; then
            python -m compileall -q nema_agora
          else
            echo "NEMA-AGORA package not present on this branch; package compilation deferred."
          fi
          python -m compileall -q pages
      - name: Audit NEMA-AGORA static import inventory
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f scripts/audit_nema_agora_inventory.py ]]; then
            echo "Inventory tool not present on this branch; audit deferred."
            exit 0
          fi
          python scripts/audit_nema_agora_inventory.py --output /tmp/nema-agora-inventory.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/nema-agora-inventory.json").read_text(encoding="utf-8"))
          modules = report["modules"]
          no_runtime = [item["module"] for item in modules if item["no_runtime_importers"]]
          test_only = [item["module"] for item in modules if item["test_importer_count"] and item["no_runtime_importers"]]
          print(f"Inventory modules: {report['module_count']}")
          print(f"Scanned Python files: {report['scanned_python_file_count']}")
          print(f"Phase-suffixed package files: {len(report['phase_suffixed_package_files'])}")
          print(f"Modules with no runtime importers (review only): {len(no_runtime)}")
          for name in no_runtime:
              print(f"  - {name}")
          print(f"Modules imported by tests but not runtime code: {len(test_only)}")
          for name in test_only:
              print(f"  - {name}")
          print(f"Unresolved internal imports: {len(report['unresolved_nema_imports'])}")
          print("Phase-suffixed files:")
          for path in report["phase_suffixed_package_files"]:
              print(f"  - {path}")
          print("Unresolved internal imports:")
          for item in report["unresolved_nema_imports"]:
              print(f"  - {item['import']} imported by {', '.join(item['importers'])}")
          print(report["warning"])
          PY
      - name: Smoke-test pilot and release-readiness pages when present
        shell: bash
        run: |
          set -euo pipefail
          smoke_test() {
            local page="$1"
            local port="$2"
            if [[ ! -f "$page" ]]; then
              echo "Skipping absent page on this branch: $page"
              return 0
            fi
            local log_file="/tmp/$(basename "$page" .py)-streamlit.log"
            set +e
            timeout 30s python -m streamlit run "$page" --server.headless true --server.port "$port" > "$log_file" 2>&1
            local exit_code=$?
            set -e
            cat "$log_file"
            if [ "$exit_code" -ne 124 ]; then
              echo "Streamlit exited before the smoke-test timeout for $page (exit $exit_code)."
              return 1
            fi
            grep -q "You can now view your Streamlit app" "$log_file"
          }
          smoke_test pages/18_NEMA_AGORA.py 8501
          smoke_test pages/171_NEMA_AGORA_RELEASE_READINESS.py 8502
