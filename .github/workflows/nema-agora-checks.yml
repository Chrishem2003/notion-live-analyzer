name: NEMA-AGORA Pilot Checks
# Focused validation for the governed NEMA-AGORA pilot branch.
# CI gate: source-contract fixes must pass before roadmap advancement.
# Stabilization pass 2: immutable history, review fixtures, and execution boundaries.

on:
  push:
    branches: [feature/nema-agora-pilot]
    paths:
      - "nema_agora/**"
      - "pages/*NEMA_AGORA*.py"
      - "tests/nema_agora/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".streamlit/config.toml"
      - ".github/workflows/nema-agora-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "nema_agora/**"
      - "pages/*NEMA_AGORA*.py"
      - "tests/nema_agora/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".streamlit/config.toml"
      - ".github/workflows/nema-agora-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Require focused NEMA-AGORA test suite
        shell: bash
        run: |
          set -euo pipefail
          test -d nema_agora
          test -d tests/nema_agora
          test -n "$(find tests/nema_agora -maxdepth 1 -type f -name 'test_*.py' -print -quit)"
          python -m pytest --confcutdir=tests/nema_agora -q tests/nema_agora
      - name: Compile NEMA-AGORA modules and pages
        shell: bash
        run: |
          set -euo pipefail
          test -d nema_agora
          test -f pages/18_NEMA_AGORA.py
          python -m compileall -q nema_agora
          python -m py_compile pages/18_NEMA_AGORA.py
      - name: Smoke-test the single NEMA-AGORA workspace page
        shell: bash
        run: |
          set -euo pipefail
          smoke_test() {
            local page="$1"
            local port="$2"
            if [[ ! -f "$page" ]]; then
              echo "Skipping absent page on this branch: $page"
              return 0
            fi
            local log_file="/tmp/$(basename "$page" .py)-streamlit.log"
            set +e
            timeout 30s python -m streamlit run "$page" --server.headless true --server.port "$port" > "$log_file" 2>&1
            local exit_code=$?
            set -e
            cat "$log_file"
            if [ "$exit_code" -ne 124 ]; then
              echo "Streamlit exited before the smoke-test timeout for $page (exit $exit_code)."
              return 1
            fi
            grep -q "You can now view your Streamlit app" "$log_file"
          }
          smoke_test pages/18_NEMA_AGORA.py 8501
