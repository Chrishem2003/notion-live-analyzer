name: NEMA-AGORA Pilot Checks

on:
  push:
    branches:
      - feature/nema-agora-pilot
    paths:
      - "nema_agora/**"
      - "pages/18_NEMA_AGORA.py"
      - "tests/nema_agora/**"
      - ".github/workflows/nema-agora-checks.yml"
  pull_request:
    branches:
      - main
    paths:
      - "nema_agora/**"
      - "pages/18_NEMA_AGORA.py"
      - "tests/nema_agora/**"
      - ".github/workflows/nema-agora-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install focused test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run NEMA-AGORA unit tests
        run: python -m pytest --confcutdir=tests/nema_agora -q tests/nema_agora/test_core.py

      - name: Compile pilot Python modules
        run: python -m compileall -q nema_agora pages/18_NEMA_AGORA.py tests/nema_agora
