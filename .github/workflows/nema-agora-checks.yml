name: NEMA-AGORA Mainline Integration Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "nema_agora/**"
      - "pages/*NEMA_AGORA*.py"
      - "tests/nema_agora/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "migrations/supabase/**"
      - ".github/workflows/nema-agora-checks.yml"
  push:
    branches: [integration/nema-agora-mainline-20261026]
    paths:
      - "nema_agora/**"
      - "pages/*NEMA_AGORA*.py"
      - "tests/nema_agora/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "migrations/supabase/**"
      - ".github/workflows/nema-agora-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nema_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nema_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nema_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt 'psycopg2-binary>=2.9'
      - name: Run NEMA-AGORA tests
        run: python -m pytest --confcutdir=tests/nema_agora -q tests/nema_agora
      - name: Compile NEMA-AGORA modules and workspace
        run: |
          python -m compileall -q nema_agora
          python -m py_compile pages/19_NEMA_AGORA_Workspace.py
      - name: Smoke-test existing application entrypoint
        shell: bash
        run: |
          set -euo pipefail
          log_file=/tmp/main-app-streamlit.log
          set +e
          timeout 30s python -m streamlit run app.py --server.headless true --server.port 8501 > "$log_file" 2>&1
          exit_code=$?
          set -e
          cat "$log_file"
          if [ "$exit_code" -ne 124 ]; then
            echo "Streamlit exited before the smoke-test timeout (exit $exit_code)."
            exit 1
          fi
          grep -q "You can now view your Streamlit app" "$log_file"
