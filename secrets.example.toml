# Bio-Research Platform Configuration
# Copy this file to .streamlit/secrets.toml and fill in your values

# ─── Notion API (Required for Notion sync) ─────────────────────────────
NOTION_TOKEN = "ntn_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
DATABASE_ID = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# ─── Supabase (Required for user management) ──────────────────────────
SUPABASE_URL = "https://your-project.supabase.co"
SUPABASE_ANON_KEY = "your-anon-key"
SUPABASE_SERVICE_KEY = "your-service-role-key"

# ─── Stripe (Optional - for payments) ─────────────────────────────────
STRIPE_SECRET_KEY = "sk_test_xxxxxxxxxxxx"
STRIPE_PUBLISHABLE_KEY = "pk_test_xxxxxxxxxxxx"
STRIPE_WEBHOOK_SECRET = "whsec_xxxxxxxxxxxx"
STRIPE_PRICE_STANDARD = "price_xxxxxxxxxxxx"
STRIPE_PRICE_PREMIUM = "price_xxxxxxxxxxxx"

# ─── Email (Optional - for reports) ───────────────────────────────────
SMTP_HOST = "smtp.gmail.com"
SMTP_PORT = "587"
SMTP_USER = "chrishem242@gmail.com"
SMTP_PASSWORD = "your-app-password"
SENDGRID_API_KEY = "SG.xxxxxxxxxxxxx"

# ─── App Configuration ────────────────────────────────────────────────
APP_URL = "https://your-app.streamlit.app"

# ─── Admin (Optional) ────────────────────────────────────────────────
ADMIN_KEY = "your-secure-admin-key"
ALLOW_NOTION_RESET = "false"