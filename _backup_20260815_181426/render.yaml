services:
  - type: web
    name: notion-live-analyzer
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Required by app.py (used to query Notion)
      # Set these in Render to enable the dashboard.
      - key: NOTION_TOKEN
        value: ""
      - key: DATABASE_ID
        value: ""
      - key: AUTO_FIX_DEPS
        value: "false"
      - key: STREAMLIT_SERVER_RUN_ON_SAVE
        value: "false"
      # Performance: reduce re-run overhead
      - key: STREAMLIT_RUNNER_FAST_RERUNS
        value: "true"

  # ─── CRON JOB: Keeps the web service awake on Render free tier ───
  # Pings the app every 14 minutes to prevent 15-min inactivity spin-down
  - type: cron
    name: notion-live-analyzer-keepalive
    env: python
    plan: free
    schedule: "*/14 * * * *"
    buildCommand: ""
    startCommand: |
      python -c "
import urllib.request, os
url = os.environ.get('RENDER_EXTERNAL_URL', 'https://YOUR-APP-URL')
try:
  r = urllib.request.urlopen(url, timeout=30)
  print(f'Ping OK — {r.status}')
except Exception as e:
  print(f'Ping FAILED — {e}')
"
    envVars:
      - key: RENDER_EXTERNAL_URL
        value: https://YOUR-APP-URL.onrender.com


