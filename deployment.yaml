apiVersion: apps/v1
kind: Deployment
metadata:
  name: chrishem-engine-deployment
  labels:
    app: chrishem-engine
spec:
  replicas: 3
  selector:
    matchLabels:
      app: chrishem-engine
  template:
    metadata:
      labels:
        app: chrishem-engine
    spec:
      containers:
      - name: chrishem-engine
        image: chrishem/intelligence-engine:latest
        ports:
        - containerPort: 8501
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 15
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: chrishem-engine-service
spec:
  type: LoadBalancer
  selector:
    app: chrishem-engine
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8501
